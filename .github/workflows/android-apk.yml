
name: Build TRUBUS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q TRUBUS-Kasir-Inventaris-source.zip -d extracted
          SETTINGS_FILE="$(find extracted -name settings.gradle -type f -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          s = p.read_text()
          block = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }"""
          if "android {" not in s:
              raise SystemExit("Blok android tidak ditemukan")
          s = s.replace("android {", block, 1)
          p.write_text(s)
          PY

      - name: Fix EditText singleLine
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/id/trubus/kasir/MainActivity.kt"
          sed -i 's/singleLine = true/setSingleLine(true)/' "$FILE"
          grep -n 'setSingleLine(true)' "$FILE"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRUBUS-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          
