
name: Build TRUBUS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        

      - name: Accept Android SDK licenses
        run: |
          mkdir extracted
          unzip -q trubus-kasir-apk.zip -d extracted
          SETTINGS_FILE="$(find extracted -name settings.gradle -type f -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: yes | sdkmanager --licenses

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRUBUS-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
